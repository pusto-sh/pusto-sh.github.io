<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#b4b9ab">
    <meta name="description" content="A quiet landscape of rolling green hills and a brushstroke circle.">
    <title>pusto.sh</title>
    <link rel="canonical" href="https://pusto.sh/">
    <link rel="icon" href="data:,">
    <meta property="og:type" content="website">
    <meta property="og:title" content="pusto.sh">
    <meta property="og:description" content="A quiet landscape of rolling green hills and a brushstroke circle.">
    <meta property="og:url" content="https://pusto.sh/">
    <meta property="og:image" content="https://pusto.sh/assets/pustosh.png">
    <meta property="og:image:width" content="1536">
    <meta property="og:image:height" content="1024">
    <meta property="og:image:alt" content="A terracotta brushstroke circle glows against a soft sky above rolling green hills.">
    <style>
      html {
        background: #b4b9ab;
      }

      body {
        margin: 0;
      }

      main {
        height: 100vh;
        height: 100dvh;
      }

      picture,
      img {
        display: block;
        width: 100%;
        height: 100%;
      }

      img {
        object-fit: cover;
        /* Keep the brushstroke circle inside the crop on portrait screens. */
        object-position: 82% 50%;
      }
    </style>
  </head>
  <body>
    <!--
      THESIS: The supplied landscape is the entire landing page.
      OWN-WORLD: Original sage hills, warm sky, texture, and terracotta brushwork.
      STORY: Arrive at pusto.sh and experience the artwork immediately.
      FIRST VIEWPORT: Edge-to-edge artwork; portrait crops retain the circle.
      FORM: Image-only, pinned by the user's supplied artwork; no concept roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <main aria-label="pusto.sh">
      <picture>
        <source srcset="assets/pustosh.webp" type="image/webp">
        <img
          src="assets/pustosh.png"
          width="1536"
          height="1024"
          alt="A terracotta brushstroke circle glows against a soft sky above rolling green hills."
          fetchpriority="high"
        >
      </picture>
    </main>
  </body>
</html>
